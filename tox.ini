[tox]
envlist = py39,py310,py311,lint,type

[testenv]
deps = -r{toxinidir}/requirements-dev.txt
commands = pytest {posargs:tests/}

[testenv:lint]
skip_install = True
deps =
    black>=22.0.0
    ruff>=0.0.200
commands =
    ruff check src/matspat tests
    black --check src/matspat tests

[testenv:format]
skip_install = True
deps =
    black>=22.0.0
    ruff>=0.0.200
commands =
    black src/matspat tests
    ruff check --fix src/matspat tests

[testenv:type]
deps = -r{toxinidir}/requirements-dev.txt
commands = mypy src/matspat

[testenv:docs]
changedir = docs
deps = -r{toxinidir}/requirements-dev.txt
commands = sphinx-build -W -b html -d {envtmpdir}/doctrees . {envtmpdir}/html
