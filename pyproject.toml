[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "matspat"
version = "0.1.0"
description = "Spatial analysis of single-cell tissue imaging for disease classification"
readme = "README.md"
requires-python = ">=3.9"
license = "BSD-3-Clause"
authors = [{name = "Contributors"}]
dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "scikit-learn>=1.0.0",
    "hmmlearn>=0.2.7",
]

# Note: freud must be installed via conda/mamba:
#   mamba install -c conda-forge freud

[project.optional-dependencies]
# QUANT and MultiROCKET + Hydra classifiers (matspat.classification.time_series)
timeseries = [
    "aeon>=1.0",
    "torch>=2.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "ruff>=0.1.0",
    "mypy>=0.950",
    "pre-commit>=3.0.0",
    "tox>=4.0.0",
    "sphinx>=4.5.0",
    "sphinx-rtd-theme>=1.0.0",
    "jupyter>=1.0.0",
    "ipython>=8.0.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# Black configuration
[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | old_src
)/
'''

# Ruff configuration
[tool.ruff]
line-length = 100
target-version = "py39"
exclude = [
    ".git",
    ".venv",
    "venv",
    ".tox",
    "old_src",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "C90",    # mccabe complexity
    "N",      # pep8-naming
    "D",      # pydocstyle
]
ignore = [
    "D100",   # Missing module docstring
    "D104",   # Missing public package docstring
    "E501",   # Line too long (black handles this)
    "N802",   # Function name should be lowercase (allows lees_L, etc.)
    "N803",   # Argument name should be lowercase (allows x, y, L, etc.)
    "N806",   # Variable in function should be lowercase (allows X, Y in scientific code)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__
"tests/*" = ["D"]         # Disable docstring checks for tests

[tool.ruff.lint.pydocstyle]
convention = "google"

# Mypy configuration
[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
exclude = [
    "old_src",
    "venv",
]

# Optional 'timeseries' extra; may not be installed
[[tool.mypy.overrides]]
module = ["aeon.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--cov=matspat --cov-report=html --cov-report=term-missing"
pythonpath = ["src"]
